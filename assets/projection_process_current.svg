<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Shared maternity projection process</title><desc id="desc">Adjusted maternities feed separate delivery and booking starting volumes. Both are currently equal; a future booking uplift will be applied before allocation if agreed. Resident charts sum the same adjusted maternities before allocation. Counts are allocated and aggregated independently for the service views.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#256681" stroke-width="1.4" /></marker></defs><rect width="1200" height="950" fill="white" /><path d="M280,100 H314" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M580,100 H614" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M880,100 H914" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M1050,172 V204 H600 V232" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M510,334 V369 H340 V397" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M690,334 V369 H860 V397" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M340,532 V577" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M860,532 V577" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M340,730 V784 H550 V827" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><path d="M860,730 V784 H650 V827" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="30" width="260" height="142" rx="3" fill="#eb7030" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="150.0" y="60">1. ONS births (L)</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="150.0" y="89">2022-based projections</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="150.0" y="112">2023 LA boundaries</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="150.0" y="135">LA(R) × source age × year</text><rect x="320" y="30" width="260" height="142" rx="3" fill="#438f24" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="450.0" y="60">2. ONS base: age split only</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="450.0" y="89">Exact_age_live_births</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="450.0" y="112">MSDS split: ≤15 and 44+</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="450.0" y="135">Ages 16–43: own count</text><rect x="620" y="30" width="260" height="142" rx="3" fill="#19627d" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="750.0" y="60">3. Allow for stillbirths</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="750.0" y="89">Births (L) × (1 + S/L)</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="750.0" y="112">S and L pooled, 2023–2025</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="750.0" y="135">National age-specific factors</text><rect x="920" y="30" width="260" height="142" rx="3" fill="#19627d" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="1050.0" y="60">4. Convert to maternities</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="1050.0" y="89">Births (L+S) × M/(L+S)</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="1050.0" y="112">Table 5 pooled, 2023–2025</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="1050.0" y="135">National age-specific factors</text><rect x="420" y="234" width="360" height="100" rx="3" fill="#eb7030" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="600.0" y="264">5. Adjusted maternities</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="600.0" y="293">One LA(R) × Age (1) × year count</text><rect x="130" y="400" width="420" height="132" rx="3" fill="#438f24" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="340.0" y="430">Delivery starting volume</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="459">Delivery_projection_base</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="482">= adjusted maternities</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="505">Pregnancies reaching live or stillbirth</text><rect x="650" y="400" width="420" height="132" rx="3" fill="#438f24" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="860.0" y="430">Booking starting volume</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="459">Booking_projection_base</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="482">= adjusted maternities for now</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="505">Future uplift method to be agreed</text><rect x="130" y="580" width="420" height="150" rx="3" fill="#19627d" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="340.0" y="610">6a. Delivery allocation</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="639">× pooled delivery-destination share</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="662">Denominator: resident maternities</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="685">Home / unknown / unrepresented</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="340.0" y="708">remain separate</text><rect x="650" y="580" width="420" height="150" rx="3" fill="#19627d" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="860.0" y="610">6b. Booking allocation</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="639">× pooled booking-provider share</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="662">Denominator: all bookings</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="685">Includes bookings without a delivery</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="860.0" y="708">No early-loss uplift applied yet</text><rect x="280" y="830" width="640" height="104" rx="3" fill="#eb7030" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="600.0" y="860">7. Completed master → reporting summaries</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="600.0" y="889">Sum completed counts into Age (B), trust, ICB and cluster</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="600.0" y="912">Keep booking and delivery views separate</text><path d="M420,284 H383" fill="none" stroke="#256681" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="234" width="360" height="100" rx="3" fill="#19627d" /><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="bold" x="200" y="264">Resident projection charts</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="200" y="293">Sum adjusted maternities by LA(R)</text><text text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="17" x="200" y="316">Same counts, before allocation</text></svg>