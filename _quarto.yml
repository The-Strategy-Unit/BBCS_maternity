project:
  type: website
  execute-dir: project
  output-dir: _site
  render:
    - index.qmd

website:
  title: "BBCS maternity: ONS analysis"
  navbar: false
  page-footer:
    left: "The Strategy Unit"
    right: "ONS data foundation"

format:
  html:
    theme: cosmo
    css: styles.css
    page-layout: full
    # Give the charts and tables more space; keep the contents list on the right.
    grid:
      sidebar-width: 0px
      body-width: 1600px
      margin-width: 250px
      gutter-width: 1rem
    toc: true
    toc-location: right
    smooth-scroll: true
    code-fold: true
    code-summary: "Show R code"
    # GT already formats the tables; leave that HTML unchanged.
    html-table-processing: none
    embed-resources: true

execute:
  echo: false
  warning: false
  message: false
  freeze: false

